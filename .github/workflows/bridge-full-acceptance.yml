name: Initial history lint (not release approval)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact initial root commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  initial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate requested commit syntax before checkout
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          python3 -c "import os,re; assert re.fullmatch('[0-9a-f]{40}',os.environ['EXPECTED'])"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, pinned
        with:
          python-version: '3.13'
      - name: Exact immutable candidate
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          python -c "import os,re,subprocess; s=os.environ['EXPECTED']; assert re.fullmatch('[0-9a-f]{40}',s); assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==s"
      - name: Single-root history and content lint only
        run: python -B tools/privacy_scan.py --root . --history --allowlist tools/public-test-exceptions.json --require-clean-history
      # A passing lint is not release approval. No private policy, State,
      # artifact upload, Git push or deployment is permitted here.
